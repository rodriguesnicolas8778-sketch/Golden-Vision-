<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Golden Vision · Administração de Imóveis</title>
<meta name="theme-color" content="#FFFCF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15110F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Golden Vision">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --black:#0E0B09; --brown:#895F49; --brown-2:#6E4A38; --gold:#B18957; --gold-soft:#F3E7D6; --cream:#FBF7F2;
  --bg:#F6F1EB; --surface:#FFFCF8; --paper:#F1E9DF; --ink:#241A15; --muted:#6D5F56; --line:#E6DACD;
  --head:#5A3C2E;
  --red:#A9442F; --red-soft:#F6E1DA; --ok:#3F6B45; --ok-soft:#DFEBDD; --warn:#94681F; --warn-soft:#F5E9D3;
  --shadow:0 1px 0 rgba(90,60,46,.06), 0 8px 24px -16px rgba(90,60,46,.3);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0908; --surface:#15110F; --paper:#1C1714; --ink:#F2E9E0; --muted:#A99A8E; --line:#2E2621; --head:#F2E9E0;
    --brown-2:#C99A7F; --gold-soft:#2E2519; --red:#E08A74; --red-soft:#3A2420; --ok:#95C59A; --ok-soft:#1D2E1F; --warn:#E0B872; --warn-soft:#33291A;
    --shadow:0 1px 0 rgba(0,0,0,.25), 0 10px 26px -18px rgba(0,0,0,.7); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0908; --surface:#15110F; --paper:#1C1714; --ink:#F2E9E0; --muted:#A99A8E; --line:#2E2621; --head:#F2E9E0;
  --brown-2:#C99A7F; --gold-soft:#2E2519; --red:#E08A74; --red-soft:#3A2420; --ok:#95C59A; --ok-soft:#1D2E1F; --warn:#E0B872; --warn-soft:#33291A;
  --shadow:0 1px 0 rgba(0,0,0,.25), 0 10px 26px -18px rgba(0,0,0,.7); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.num{font-family:Montserrat,"Source Sans 3",system-ui,sans-serif}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
img{max-width:100%}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:22px;padding:22px 18px 20px;background:var(--surface);border-right:1px solid var(--line)}
.brand{display:block;padding:4px 6px 0}
.brand img{display:block;width:100%;height:auto}
.brand .icon{display:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:9px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--paper);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--black);color:var(--cream)}
:root[data-theme="dark"] .nav button[aria-current="page"]{background:var(--brown);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nav button[aria-current="page"]{background:var(--brown);color:#fff}}
.nav .count{font:600 12px/1 Montserrat,sans-serif;padding:4px 7px;border-radius:20px;background:var(--red);color:#fff}
.side-foot{margin-top:auto;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.save{display:flex;align-items:center;gap:8px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.save.busy i{background:var(--gold);animation:pulse 1s infinite}
.save.err i{background:var(--red)}
@keyframes pulse{50%{opacity:.35}}
.foot-btns{display:flex;gap:6px;flex-wrap:wrap}
.tbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--muted)}
.tbtn:hover{color:var(--ink);border-color:var(--gold)}
.tbtn[aria-pressed="true"]{background:var(--gold-soft);color:var(--ink);border-color:var(--gold)}

main{min-width:0;padding:30px clamp(16px,3.2vw,44px) 60px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.top h1{margin:0;font-size:clamp(22px,2.4vw,30px);font-weight:700;color:var(--head);letter-spacing:-.01em}
.top p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--brown)}
.btn.primary{background:var(--brown);border-color:var(--brown);color:#fff}
.btn.primary:hover{background:var(--brown-2);border-color:var(--brown-2)}
.btn.dark{background:var(--black);border-color:var(--black);color:var(--cream)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1E140C}
.btn.gold:hover{filter:brightness(1.06)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--red)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:16px;height:16px}

.month{display:inline-flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.month button{background:none;border:0;width:38px;height:38px;font-size:18px;color:var(--brown)}
.month button:hover{background:var(--paper)}
.month span{font:600 14px/1 Montserrat,sans-serif;min-width:136px;text-align:center;padding:0 4px}

.notice{background:var(--warn-soft);color:var(--warn);border:1px dashed var(--gold);border-radius:12px;padding:10px 14px;margin-bottom:20px;font-size:14px}

/* ---------- ledger ---------- */
.ledger{display:grid;grid-template-columns:1.5fr repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.ledger > div{padding:18px 20px;border-left:1px solid var(--line);min-width:0}
.ledger > div:first-child{border-left:0;background:var(--black);color:var(--cream)}
:root[data-theme="dark"] .ledger > div:first-child{background:#2A1D16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ledger > div:first-child{background:#2A1D16}}
.ledger .k{font-size:13px;color:var(--muted);margin-bottom:6px}
.ledger > div:first-child .k{color:#CDB9A7}
.ledger .v{font:700 clamp(18px,1.8vw,24px)/1.15 Montserrat,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.ledger > div:first-child .v{font-size:clamp(24px,2.6vw,34px);color:var(--gold)}
.ledger .s{font-size:12.5px;color:var(--muted);margin-top:6px}
.ledger > div:first-child .s{color:#E2CBA9}
.ledger .v.red{color:var(--red)}

.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .kl{font-size:13px;color:var(--muted);font-weight:600}
.kpi .kv{font:700 21px/1.15 Montserrat,sans-serif;font-variant-numeric:tabular-nums}
.kpi .kn{font-size:12.5px;color:var(--muted)}
.kbar{height:5px;border-radius:5px;background:var(--paper);overflow:hidden}
.kbar i{display:block;height:100%;background:var(--brown)}
.kpi.hl{background:var(--gold-soft);border-color:var(--gold)}
.kpi.good .kv{color:var(--ok)} .kpi.good .kbar i{background:var(--ok)}
.kpi.mid .kv{color:var(--warn)} .kpi.mid .kbar i{background:var(--gold)}
.kpi.bad .kv{color:var(--red)} .kpi.bad .kbar i{background:var(--red)}

/* ---------- panels ---------- */
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;margin-top:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px;min-width:0}
.panel h2{margin:0;font-size:16px;font-weight:700}
.panel-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.panel-head p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.chart-wrap{position:relative}
.chart{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;line-height:1.4;padding:8px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s}
.tip b{font-family:Montserrat,sans-serif}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.rows .t{font-weight:600}
.rows .d{font-size:13px;color:var(--muted)}
.rows .r{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}

/* ---------- tables ---------- */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{flex:1 1 220px;max-width:360px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:600 12.5px/1.3 "Source Sans 3",sans-serif;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--paper)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td:first-child{min-width:190px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.a{text-align:right;white-space:nowrap}
.acts{display:inline-flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--paper)}
tfoot td{background:var(--paper);font-weight:700;font-family:Montserrat,sans-serif;font-size:13.5px}
.sub{display:block;font-size:12.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.late{background:var(--red-soft);color:var(--red)}
.chip.mute{background:var(--paper);color:var(--muted)}
.section-gap{margin-top:30px}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:12px}
.sec-head h2{margin:0;font-size:19px;color:var(--head)}
.sec-head p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty h3{margin:0 0 6px;color:var(--ink);font-size:18px}
.empty .actions{justify-content:center;margin-top:16px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px}
.card h3{margin:0;font-size:16px}
.card dl{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:0;font-size:14px}
.card dt{color:var(--muted)}
.card dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.card .foot{display:flex;gap:8px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.card .foot .btn:last-child{margin-left:auto}

/* ---------- drawer & dialog ---------- */
.scrim{position:fixed;inset:0;background:rgba(14,11,9,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(660px,100%);background:var(--bg);z-index:21;transform:translateX(100%);transition:transform .25s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden}
.drawer.on{transform:none;visibility:visible}
.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 22px;border-bottom:1px solid var(--line);background:var(--surface)}
.drawer-head h2{margin:0;font-size:19px;color:var(--head)}
.drawer-body{flex:1;min-height:0;overflow-y:auto;padding:20px 22px 40px;display:flex;flex-direction:column;gap:18px}
.drawer-body > *{flex:none}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.facts > div{background:var(--surface);padding:12px 14px;min-width:0}
.facts .k{font-size:12.5px;color:var(--muted)}
.facts .v{font:600 15px/1.35 Montserrat,sans-serif;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.facts .full{grid-column:1/-1}
.x{background:none;border:0;font-size:24px;line-height:1;color:var(--muted);padding:4px 8px}
.sect-title{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sect-title h3{margin:0;font-size:15px}
.bd-res{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bd-res>div{display:flex;justify-content:space-between;gap:10px;background:var(--surface);padding:10px 12px;font-size:14px}
.bd-res span{color:var(--muted)}
.bd-res b{font-variant-numeric:tabular-nums;white-space:nowrap}
.bd-res .bd-liq{grid-column:1/-1;background:var(--gold-soft)}
.bd-res .bd-liq span{color:var(--ink);font-weight:700}
.bd-res .bd-liq b{font-size:17px;color:var(--brown)}
:root[data-theme="dark"] .bd-res .bd-liq b{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bd-res .bd-liq b{color:var(--gold)}}
.drawer .table-wrap{box-shadow:none}
.drawer td:first-child{min-width:0}
.drawer-acts{display:flex;flex-wrap:wrap;gap:8px}

dialog{border:0;border-radius:18px;padding:0;width:min(620px,calc(100% - 24px));max-height:calc(100% - 40px);background:var(--surface);color:var(--ink);box-shadow:0 30px 80px -30px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(14,11,9,.55)}
dialog form{display:flex;flex-direction:column;max-height:calc(100dvh - 40px)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.dlg-head h2{margin:0;font-size:18px}
.dlg-body{padding:18px 22px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 18px;overflow-y:auto}
.dlg-body .full{grid-column:1/-1}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--line);background:var(--paper);border-radius:0 0 18px 18px}
.dlg-foot .danger{margin-right:auto}
label.f{display:flex;flex-direction:column;justify-content:flex-end;gap:6px;min-width:0;font-size:13px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea{min-width:0;max-width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 12px;font-weight:400;font-size:16px;line-height:1.35;color:var(--ink);width:100%;font-family:inherit}
label.f input,label.f select{height:46px}
label.f textarea{min-height:80px;resize:vertical}
label.f input[type=date]{-webkit-appearance:none;appearance:none;display:block;text-align:left}
label.f input:focus,label.f select:focus,label.f textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
.preview{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:var(--gold-soft);border-radius:12px;padding:12px 14px}
.preview .k{font-size:12px;color:var(--muted)}
.preview .v{font:700 16px/1.3 Montserrat,sans-serif;font-variant-numeric:tabular-nums}
.hint{grid-column:1/-1;font-size:12.5px;color:var(--muted);margin:-4px 0 0}
.fieldset-title{grid-column:1/-1;margin:6px 0 -4px;font:700 13px/1 Montserrat,sans-serif;color:var(--brown)}
.check{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;background:var(--paper);border-radius:10px;padding:10px 12px}
.check input{width:18px;height:18px;accent-color:var(--brown)}
.err{grid-column:1/-1;margin:0;color:var(--red);font-weight:600;font-size:14px}
.err:empty{display:none}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--black);color:var(--cream);border:1px solid var(--gold);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:.2s;z-index:40;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

body.discreto .num, body.discreto td.n, body.discreto .v, body.discreto .kv, body.discreto .rows .r b, body.discreto .card dd, body.discreto .bd-res b, body.discreto .chart text.val, body.discreto .chart rect:not(.hit), body.discreto .tip{filter:blur(7px);user-select:none}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .ledger{grid-template-columns:repeat(2,1fr)}
  .ledger > div{border-left:0;border-top:1px solid var(--line)}
  .ledger > div:first-child{grid-column:1/-1;border-top:0}
  .ledger > div:nth-child(odd):not(:first-child){border-left:1px solid var(--line)}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side,.nav{min-width:0}
  .side{position:sticky;top:0;z-index:10;height:auto;flex-direction:row;align-items:center;gap:10px;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);padding-top:calc(8px + env(safe-area-inset-top,0px))}
  .brand{width:40px;height:40px;padding:0;flex:none;display:flex;align-items:center}
  .brand .full{display:none}
  .brand .icon{display:block}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{white-space:nowrap;padding:8px 11px;font-size:14px}
  .side-foot{margin:0 0 0 auto;flex:none;flex-direction:row;align-items:center}
  .side-foot .foot-btns{display:none}
  .save span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .save i{width:10px;height:10px}
  main{padding-top:20px}
  .dlg-body{grid-template-columns:1fr}
  .facts{grid-template-columns:1fr 1fr}
  .top{align-items:flex-start}
}
@media (max-width:640px){
  table.stack thead{display:none}
  table.stack,table.stack tbody,table.stack tfoot{display:block}
  table.stack tr{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-bottom:1px solid var(--line)}
  table.stack tbody tr:last-child{border-bottom:0}
  table.stack td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:0;min-width:0!important;text-align:right;background:none!important}
  table.stack td:first-child{display:block;text-align:left;margin-bottom:2px}
  table.stack td[data-l]::before{content:attr(data-l);color:var(--muted);font:400 13px/1.3 "Source Sans 3",sans-serif;text-align:left}
  table.stack td:empty{display:none}
  table.stack td.a{justify-content:flex-end;margin-top:4px}
  table.stack td:not(:first-child) .sub{display:inline;margin-left:6px}
  table.stack tfoot tr{background:var(--paper);border-radius:0 0 16px 16px}
}
@media (max-width:480px){
  .ledger{grid-template-columns:1fr}
  .ledger > div:nth-child(odd):not(:first-child){border-left:0}
  .preview{grid-template-columns:1fr 1fr}
  .facts{grid-template-columns:1fr}
  .bd-res{grid-template-columns:1fr}
  .month span{min-width:110px;font-size:13px}
}
body.is-locked .side-foot .save, body.is-locked #sairBtn{display:none}
.lock{max-width:420px;margin:8vh auto 0;text-align:center}
.lock img{width:min(260px,70%);height:auto;display:block;margin:0 auto 18px}
.lock h3{margin:0 0 6px;font-size:19px}
.lock p{margin:0;color:var(--muted)}
.lock form{display:flex;flex-direction:column;gap:12px;margin:22px auto 0;max-width:320px}
.lock input[type=password],.lock input[type=url]{font:600 20px/1.2 Montserrat,system-ui,sans-serif;text-align:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.lock input[type=password]{letter-spacing:.3em}
.lock input[type=url]{font:14px/1.3 system-ui,sans-serif;letter-spacing:0}
.lock .btn{justify-content:center}
.lock .lembrar{font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:center}
.lock .err{min-height:1.3em}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
function buildReportPDF(jsPDF, R, logoDataUrl) {
  // R: {periodo, imoveisTxt, proprietario, receita, despesas, taxa, liquido, alugueis, outros,
  //     desp:{manut,util,taxas,outros}, repasses:[{data,valor}], forma, situacao:[{titulo,status,inquilino,pagamento}],
  //     obs:[...], cfg:{empresa, creci, responsavel, creciPF}}
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const W = 595.28, H = 841.89, L = 85, Rm = W - 85;
  let y = 50;
  const money = v => 'R$ ' + (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const need = h => { if (y + h > H - 60) { doc.addPage(); y = 70; } };

  if (logoDataUrl) { const lw = 170, lh = lw * 187 / 391; doc.addImage(logoDataUrl, 'PNG', (W - lw) / 2, y, lw, lh); y += lh + 38; }
  else y += 30;

  doc.setFont('times', 'bold'); doc.setFontSize(15);
  doc.text('RELATÓRIO DE PRESTAÇÃO DE CONTAS', W / 2, y, { align: 'center' }); y += 26;
  doc.setFontSize(11.5);
  doc.text('Administração de Imóveis', W / 2, y, { align: 'center' }); y += 44;

  doc.setFontSize(11.5);
  const field = (label, val) => {
    doc.setFont('times', 'bold'); doc.text(label, L, y);
    const lw = doc.getTextWidth(label + ' ');
    doc.setFont('times', 'normal');
    const lines = doc.splitTextToSize(String(val || '—'), Rm - L - lw);
    doc.text(lines, L + lw, y); y += 15 * (lines.length - 1) + 30;
  };
  const c = R.cfg || {};
  field('Empresa:', c.empresa || 'Golden Vision-Imobiliária e Serviços');
  field('Creci:', c.creci || '');
  field('Período:', R.periodo);
  field('Imóveis:', R.imoveisTxt);
  field('Proprietário(a):', R.proprietario);

  const head = (t, h = 40) => { need(h); doc.setFont('times', 'bold'); doc.setFontSize(11.5); doc.text(t, L, y); y += 26; };
  head('1.RESUMO FINANCEIRO');
  const rows = [['DESCRIÇÃO', 'Valor (R$)'], ['Receita do período', money(R.receita)], ['Despesas', money(R.despesas)],
    ['Taxa de administração', money(R.taxa)], ['VALOR LIQUÍDO', money(R.liquido)]];
  const tw = Rm - L + 2, rh = 29, mid = L + tw / 2;
  need(rh * rows.length + 20);
  doc.setLineWidth(0.6); doc.setDrawColor(0);
  doc.setFont('times', 'normal');
  rows.forEach((r, i) => {
    doc.rect(L, y, tw / 2, rh); doc.rect(mid, y, tw / 2, rh);
    doc.text(r[0], L + 7, y + 19); doc.text(r[1], mid + 7, y + 19); y += rh;
  });
  y += 32;

  const bullet = t => {
    doc.setFont('times', 'normal'); doc.setFontSize(11.5);
    const lines = doc.splitTextToSize(t, Rm - L - 22);
    need(lines.length * 15 + 8);
    doc.circle(L + 4, y - 3.6, 1.6, 'F');
    doc.text(lines, L + 22, y); y += lines.length * 15 + 8;
  };
  head('2. RECEITAS', 100);
  bullet('Aluguéis: ' + money(R.alugueis));
  bullet('Outros recebimentos: ' + money(R.outros));
  bullet('Total: ' + money(R.receita));
  y += 14;
  head('3. DESPESAS', 150);
  bullet('Manutenção: ' + money(R.desp.manut));
  bullet('Utilidades (água/energia/etc.): ' + money(R.desp.util));
  bullet('Taxas/Impostos: ' + money(R.desp.taxas));
  bullet('Outros: ' + money(R.desp.outros));
  bullet('Total: ' + money(R.despesas));
  if (R.itensDesp && R.itensDesp.length) {
    y += 2; doc.setFontSize(10.5);
    R.itensDesp.forEach(s => { const lines = doc.splitTextToSize('– ' + s, Rm - L - 40); need(lines.length * 13 + 4); doc.setFont('times', 'italic'); doc.text(lines, L + 34, y); y += lines.length * 13 + 4; });
    doc.setFontSize(11.5);
  }
  y += 14;
  head('4. REPASSE AO PROPRIETÁRIO', 80);
  if (R.repasses.length) R.repasses.forEach(r => bullet(r.data + ' - ' + money(r.valor).replace('R$ ', 'R$')));
  else bullet('Repasse pendente - ' + money(R.liquido).replace('R$ ', 'R$'));
  if (R.forma) bullet('Forma: ' + R.forma);
  y += 14;
  head('5. SITUAÇÃO DO IMÓVEL', 100);
  const multi = R.situacao.length > 1;
  R.situacao.forEach(s => {
    if (multi) { need(40); doc.setFont('times', 'bold'); doc.text(s.titulo, L, y); y += 20; }
    bullet('Status: ' + s.status);
    if (s.inquilino) bullet('Inquilino (a): ' + s.inquilino);
    bullet('Pagamento: ' + s.pagamento);
    if (multi) y += 6;
  });
  y += 14;
  head('6. OBSERVAÇÕES');
  (R.obs.length ? R.obs : ['Sem observações neste período.']).forEach(bullet);

  need(130); y += 60;
  doc.setLineWidth(0.5); doc.line(W / 2 - 110, y, W / 2 + 110, y); y += 20;
  doc.setFont('times', 'bold'); doc.text('RESPONSÁVEL', W / 2, y, { align: 'center' }); y += 18;
  doc.setFont('times', 'normal');
  if (c.responsavel) { doc.text(c.responsavel, W / 2, y, { align: 'center' }); y += 18; }
  if (c.creciPF) doc.text('CRECI-PF: ' + c.creciPF, W / 2, y, { align: 'center' });
  return doc;
}


</script>

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>((Number(v)||0)<-0.004?'- ':'')+'R$ '+Math.abs(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const brlK=v=>{v=+v||0;if(Math.abs(v)>=1e6)return 'R$ '+(v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi';if(Math.abs(v)>=1e3)return 'R$ '+(v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil';return 'R$ '+Math.round(v)};
const pct=v=>(+v||0).toLocaleString('pt-BR',{maximumFractionDigits:0})+'%';
const parseBR=s=>{s=String(s??'').replace(/R\$|\s|%/g,'');if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=Number(s);return isFinite(n)?n:0};
const fmtIn=v=>v||v===0?(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):'';
const dBR=iso=>iso?iso.split('-').reverse().join('-'):'';
const dBRs=iso=>iso?iso.split('-').reverse().join('/'):'—';
const mesLabel=m=>{const[y,mm]=m.split('-');return MESES[+mm-1]+' '+y};
const mesNome=m=>MESES[+m.slice(5)-1].toLowerCase();
const mesShort=m=>{const[y,mm]=m.split('-');return MESES[+mm-1].slice(0,3)+'/'+y.slice(2)};
const shiftMes=(m,d)=>{let[y,mm]=m.split('-').map(Number);mm+=d;while(mm>12){mm-=12;y++}while(mm<1){mm+=12;y--}return y+'-'+String(mm).padStart(2,'0')};
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const defDate=m=>todayISO().startsWith(m)?todayISO():m+'-01';
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const plural=(n,s,p)=>n+' '+(n===1?s:p);
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

/* ================= theme / discreto ================= */
function isDark(){const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme:dark)').matches}
function applyTheme(t){if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme;$('#themeBtn').textContent=isDark()?'Tema claro':'Tema escuro'}
applyTheme(lsGet('gv-theme'));
$('#themeBtn').onclick=()=>{const t=isDark()?'light':'dark';lsSet('gv-theme',t);applyTheme(t)};
function applyDisc(on){document.body.classList.toggle('discreto',on);$('#discBtn').setAttribute('aria-pressed',on?'true':'false');$('#discBtn').textContent=on?'Mostrar valores':'Ocultar valores'}
applyDisc(lsGet('gv-disc')==='1');
$('#discBtn').onclick=()=>{const on=!document.body.classList.contains('discreto');lsSet('gv-disc',on?'1':'0');applyDisc(on)};

const APP=true; // true = app no celular (servidor Google Planilhas); false = artefato no Claude
let db=null;
const SRVK='gv.app.servidor',TOKK='gv.app.sessao',CACHEK='gv.app.cache';
let SERVER=null,TOK=null,versaoAtual=null,pinGate=false,pinMsg='',trocarSrv=false,pollT=null;
const lsGet2=k=>{try{return localStorage.getItem(k)||sessionStorage.getItem(k)}catch(e){return null}};
const lsSet2=(k,v,sess)=>{try{localStorage.removeItem(k);sessionStorage.removeItem(k);if(v!=null)(sess?sessionStorage:localStorage).setItem(k,v)}catch(e){}};
async function api(fn,...args){
  let r;try{r=await fetch(SERVER,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args}),redirect:'follow'})}catch(e){throw new Error('rede')}
  let j;try{j=await r.json()}catch(e){throw new Error('servidor')}
  if(!j||!j.ok){const m=(j&&j.err)||'erro';if(/sessao/.test(m))setTimeout(()=>voltarAoPin('Sua sessão terminou. Digite o PIN de novo.'),0);throw new Error(m)}
  return j.r;
}
function todosDocs(){
  const d=[];const add=(col,o)=>{const{id,...data}=o;d.push({col,id,data})};
  S.props.forEach(o=>add('proprietarios',o));S.imoveis.forEach(o=>add('imoveis',o));S.servicos.forEach(o=>add('servicos',o));
  Object.values(S.lanc).forEach(o=>add('lancamentos',o));Object.values(S.rep).forEach(o=>add('repasses',o));
  if(Object.keys(S.cfg||{}).length)d.push({col:'config',id:'geral',data:S.cfg});return d;
}
function aplicar(res,doCache){
  S.props=[];S.imoveis=[];S.servicos=[];S.lanc={};S.rep={};S.cfg={};
  (res.docs||[]).forEach(x=>{let o;try{o=typeof x.json==='string'?JSON.parse(x.json):x.data}catch(e){return}if(!o||typeof o!=='object')return;
    if(x.col==='config'){if(x.id==='geral')S.cfg=o}else if(['proprietarios','imoveis','servicos','lancamentos','repasses'].includes(x.col))memSet(x.col,x.id,o)});
  versaoAtual=res.versao;S.loaded=true;
  if(doCache){try{localStorage.setItem(CACHEK,JSON.stringify({versao:res.versao,docs:todosDocs().map(x=>({col:x.col,id:x.id,json:JSON.stringify(x.data)}))}))}catch(e){}}
  render();
}
async function carregar(){
  S.sync=true;setSave();
  try{aplicar(await api('carregar',TOK),true);S.offline=false;S.saveErr=false}
  catch(e){if(/sessao/.test(e.message))return;S.offline=true;
    let c=null;try{c=JSON.parse(localStorage.getItem(CACHEK))}catch(x){}
    if(c)aplicar(c,false);else{S.loaded=true;render()}}
  finally{S.sync=false;setSave()}
}
function vigiar(){clearInterval(pollT);pollT=setInterval(async()=>{
  if(!TOK||S.pending||document.hidden||dlg.open)return;
  try{const v=await api('versao',TOK);if((v!==versaoAtual||S.offline)&&!S.pending)await carregar()}catch(e){}},15000)}
document.addEventListener('visibilitychange',()=>{if(APP&&!document.hidden&&TOK&&!S.pending&&S.loaded)carregar()});
const srvOk=u=>/^https:\/\/script\.google\.com\/(a\/macros\/[^\/]+|macros)\/s\/[A-Za-z0-9_-]{20,}\/exec$/.test(u);
async function entrarComPin(pin,lembrar,srv){
  if(srv!=null){srv=srv.trim();if(!srvOk(srv)){pinMsg='Endereço inválido. Ele começa com https://script.google.com/ e termina com /exec.';render();return}SERVER=srv}
  if(!SERVER){pinMsg='Informe o endereço do servidor.';render();return}
  if(!pin){pinMsg='Digite o PIN.';render();return}
  pinMsg='Entrando…';render();
  let r;try{r=await api('entrar',pin,!!lembrar)}catch(e){pinMsg=e.message==='rede'?'Sem conexão com o servidor. Confira a internet e o endereço.':'O servidor não respondeu direito. Confira se a implantação está como "Qualquer pessoa".';render();return}
  if(!r||!r.ok){pinMsg=(r&&r.msg)||'PIN incorreto.';render();const i=$('#pin');if(i){i.value='';i.focus()}return}
  lsSet2(SRVK,SERVER);TOK=r.token;lsSet2(TOKK,TOK,!lembrar);
  pinGate=false;trocarSrv=false;pinMsg='';S.loaded=false;render();await carregar();vigiar();
}
function voltarAoPin(msg){
  TOK=null;lsSet2(TOKK,null);try{localStorage.removeItem(CACHEK)}catch(e){}clearInterval(pollT);
  S.props=[];S.imoveis=[];S.servicos=[];S.lanc={};S.rep={};S.cfg={};
  pinGate=true;pinMsg=msg||'';S.loaded=true;closeDrawer();try{if(dlg.open)dlg.close()}catch(e){}render();
}
function sair(){const t=TOK;if(t)api('sair',t).catch(()=>{});voltarAoPin('Você saiu deste aparelho.')}
async function connect(){
  SERVER=lsGet2(SRVK);TOK=lsGet2(TOKK);$('#sairBtn').hidden=false;$('#sairBtn').onclick=sair;
  if(!SERVER||!TOK){pinGate=true;S.loaded=true;render();return}
  await carregar();if(TOK)vigiar();
}

function setSave(){
  const e=$('#save');e.className='save'+(S.saveErr||S.offline?' err':S.pending||S.sync?' busy':'');
  const t=APP?(S.offline?'Sem internet: mostrando os últimos dados salvos':S.saveErr?'Erro ao salvar':S.pending?'Salvando…':S.sync?'Sincronizando…':'Salvo na planilha')
    :(S.offline?'Não está salvando':S.saveErr?'Erro ao salvar':S.pending?'Salvando…':S.loaded?'Tudo salvo':'Carregando…');
  e.querySelector('span').textContent=t;e.title=t;
}
async function save(col,id,data){
  if(APP){
    if(S.offline){toast('Sem internet. Alterações só funcionam com conexão.');throw new Error('offline')}

    catch(e){S.saveErr=true;toast('Não foi salvo. Confira a conexão e repita.');S.pending--;setSave();carregar();throw e}
    S.pending--;setSave();return;
  }
  if(!db){memSet(col,id,data);render();return}

}
async function remove(col,id){
  if(APP){
    if(S.offline){toast('Sem internet. Alterações só funcionam com conexão.');throw new Error('offline')}
    memDel(col,id);render();S.pending++;setSave();
    try{await api('excluir',TOK,col,id);S.saveErr=false}
    catch(e){S.saveErr=true;toast('Não foi excluído. Confira a conexão e repita.');S.pending--;setSave();carregar();throw e}
    S.pending--;setSave();return;
  }

  S.pending++;setSave();

}
function memSet(col,id,data){
  if(col==='lancamentos')S.lanc[id]={id,...data};else if(col==='repasses')S.rep[id]={id,...data};else if(col==='config')S.cfg=data;
  else{const k=Object.keys(COLS).find(k=>COLS[k]===col);if(!k)return;const i=S[k].findIndex(x=>x.id===id);if(i>=0)S[k][i]={id,...data};else S[k].push({id,...data})}
}
function memDel(col,id){
  if(col==='lancamentos')delete S.lanc[id];else if(col==='repasses')delete S.rep[id];
  else{const k=Object.keys(COLS).find(k=>COLS[k]===col);if(!k)return;S[k]=S[k].filter(x=>x.id!==id)}
}
function handleErr(e){

  if(c==='invalid_argument'){S.readonly=true;toast('Seu acesso é só de leitura');render()}
  else if(c==='quota_exceeded')toast('Limite de armazenamento atingido');
  else toast('Não foi possível salvar. Tente de novo.');
}
async function initDb(){
  if(APP){await connect();return}
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(!db){S.offline=true;S.loaded=true;setSave();render();return}
  let pending=6;const done=()=>{if(--pending<=0){S.loaded=true;setSave()}render()};
  const onErr=e=>{console.warn(e);if(e&&e.code==='revoked'){S.readonly=true;render()}};
  const sub=(col,fn)=>{let first=true;db.collection(col).onSnapshot(s=>{fn(s.docs.map(d=>({id:d.id,...d.data()})));if(first){first=false;done()}else render()},onErr)};
  sub('proprietarios',a=>S.props=a);
  sub('imoveis',a=>S.imoveis=a);
  sub('servicos',a=>S.servicos=a);
  sub('lancamentos',a=>{S.lanc={};a.forEach(x=>S.lanc[x.id]=x)});
  sub('repasses',a=>{S.rep={};a.forEach(x=>S.rep[x.id]=x)});
  let firstCfg=true;db.doc('config/geral').onSnapshot(s=>{S.cfg=s.exists?s.data():{};if(firstCfg){firstCfg=false;done()}else render()},onErr);
  try{const u=await window.claude.use('user');if(u&&u.can){const w=await u.can('data.write');if(w===false){S.readonly=true;render()}}}catch(e){}
}

const byName=(a,b)=>(a.nome||'').localeCompare(b.nome||'');
const propName=id=>(S.props.find(p=>p.id===id)||{}).nome||'—';
const imoveisDe=pid=>S.imoveis.filter(i=>i.proprietarioId===pid).sort((a,b)=>(a.descricao||'').localeCompare(b.descricao||''));
const lancOf=(iid,m)=>S.lanc[iid+'_'+m];
const repOf=(pid,m)=>S.rep[pid+'_'+m];
const servDe=(iid,m)=>S.servicos.filter(s=>s.imovelId===iid&&(s.data||'').startsWith(m));
const lastDay=m=>{const[y,mm]=m.split('-').map(Number);return new Date(y,mm,0).getDate()};
function vencISO(im,m){const d=Math.min(Number(im.vencimento)||0,lastDay(m));return d?m+'-'+String(d).padStart(2,'0'):''}
function pagStatus(im,m){
  if(im.status==='Vago')return{k:'vago',txt:'Imóvel vago',cls:'mute',pdf:'Não se aplica (imóvel vago)'};
  const L=lancOf(im.id,m),v=vencISO(im,m);
  if(L&&L.recebido){if(!v||!L.dataPagamento||L.dataPagamento<=v)return{k:'pago',txt:'Recebido',cls:'ok',pdf:'Em dia'};return{k:'pagoAtr',txt:'Recebido com atraso',cls:'warn',pdf:'Pago com atraso ('+dBR(L.dataPagamento)+')'}}
  if(v&&todayISO()>v)return{k:'atraso',txt:'Em atraso',cls:'late',pdf:'Em atraso'};
  return{k:'aberto',txt:v?'Vence '+dBRs(v).slice(0,5):'Aguardando',cls:'warn',pdf:'Aguardando pagamento'};
}
function calcImovel(im,m){
  const L=lancOf(im.id,m)||{};
  const aluguel=L.recebido?Number(L.valorRecebido??im.valor)||0:0;
  const outros=L.recebido?Number(L.outros)||0:0;
  const taxa=aluguel*(Number(im.taxa??10)||0)/100;
  const serv=servDe(im.id,m).filter(s=>s.desconta!==false);
  const desp={manut:0,util:0,taxas:0,outros:0};serv.forEach(s=>desp[s.cat in desp?s.cat:'outros']+=Number(s.valor)||0);
  const despesas=desp.manut+desp.util+desp.taxas+desp.outros;
  return{aluguel,outros,receita:aluguel+outros,taxa,desp,despesas,liquido:aluguel+outros-taxa-despesas,serv};
}
function calcProp(pid,m){
  const t={aluguel:0,outros:0,receita:0,taxa:0,despesas:0,liquido:0,desp:{manut:0,util:0,taxas:0,outros:0},serv:[],previsto:0};
  imoveisDe(pid).forEach(im=>{const c=calcImovel(im,m);['aluguel','outros','receita','taxa','despesas','liquido'].forEach(k=>t[k]+=c[k]);Object.keys(t.desp).forEach(k=>t.desp[k]+=c.desp[k]);t.serv.push(...c.serv.map(s=>({...s,imovel:im})));if(im.status!=='Vago')t.previsto+=Number(im.valor)||0});
  return t;
}
function totaisMes(m){
  const t={previsto:0,recebido:0,taxa:0,liquido:0,despesas:0,atrasoV:0,atrasoN:0,abertoN:0,repFeito:0,repPend:0,repPendV:0,repassado:0,locados:0,pontuais:0,pagos:0};
  S.imoveis.forEach(im=>{if(im.status==='Vago')return;t.locados++;t.previsto+=Number(im.valor)||0;const st=pagStatus(im,m);
    if(st.k==='atraso'){t.atrasoN++;t.atrasoV+=Number(im.valor)||0}if(st.k==='aberto')t.abertoN++;if(st.k==='pago'||st.k==='pagoAtr'){t.pagos++;if(st.k==='pago')t.pontuais++}});
  S.props.forEach(p=>{const c=calcProp(p.id,m);t.recebido+=c.aluguel;t.taxa+=c.taxa;t.liquido+=c.liquido;t.despesas+=c.despesas;const R=repOf(p.id,m);
    if(R&&R.feito){t.repFeito++;t.repassado+=Number(R.valor??c.liquido)||0}else if(c.receita>0){t.repPend++;t.repPendV+=c.liquido}});
  return t;
}

function chartSVG(){

async function baixarArquivo(filename,blob){
  let dl=null;if(!APP){try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}}
  if(dl){try{await dl.save({filename,data:blob});return true}catch(e){if(e&&e.code==='declined')return false;if(e&&e.code==='rate_limited'){toast('Aguarde um instante e tente de novo');return false}}}
  try{const f=new File([blob],filename,{type:blob.type});if(APP&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:filename});return true}}catch(e){if(e&&e.name==='AbortError')return false}
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return true;
}
async function backup(){
  const data=JSON.stringify({app:'golden-vision',formato:1,em:new Date().toISOString(),docs:todosDocs()},null,1);
  if(await baixarArquivo('backup-golden-vision-'+todayISO()+'.json',new Blob([data],{type:'application/json'})))toast('Backup gerado');
}
function restaurar(){
  const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
  i.onchange=async()=>{const f=i.files[0];if(!f)return;let j;try{j=JSON.parse(await f.text())}catch(e){toast('Arquivo inválido');return}
    if(!j||j.app!=='golden-vision'||!Array.isArray(j.docs)){toast('Este arquivo não é um backup da Golden Vision');return}
    const docs=j.docs.filter(d=>d&&typeof d.col==='string'&&typeof d.id==='string'&&d.data&&typeof d.data==='object');
    if(!confirm('Restaurar '+docs.length+' registros? Registros com o mesmo código serão substituídos; os demais continuam.'))return;
    try{
      if(APP){S.pending++;setSave();try{await api('importar',TOK,docs.map(d=>({col:d.col,id:d.id,json:JSON.stringify(d.data)})))}finally{S.pending--;setSave()}await carregar()}
      else if(db){for(const d of docs){if(d.col==='config')await db.doc('config/'+d.id).set(d.data);else await db.collection(d.col).doc(d.id).set(d.data)}}
      else{docs.forEach(d=>memSet(d.col,d.id,d.data));render()}
      toast('Backup restaurado');
    }catch(e){toast('A restauração não terminou. Tente de novo.')}
  };i.click();
}

     submit:async f=>{if(!f.descricao.trim())return 'Informe o endereço do imóvel.';if(f.status==='Locado'&&!parseBR(f.valor))return 'Informe o valor do aluguel.';
      const id=im.id||uid('i');
      await save('imoveis',id,{proprietarioId:f.proprietarioId,descricao:f.descricao.trim(),tipo:f.tipo,status:f.status,valor:parseBR(f.valor),vencimento:f.vencimento?Math.min(31,Math.max(1,parseInt(f.vencimento))):'',taxa:parseBR(f.taxa),inquilino:f.inquilino.trim()});
      toast(isNew?'Imóvel cadastrado':'Imóvel atualizado')},
     del:im.id?async()=>{await remove('imoveis',im.id);toast('Imóvel excluído')}:null});
}
function dlgServico(s,pid){
  const ims=(pid?imoveisDe(pid):S.imoveis.slice().sort((a,b)=>propName(a.proprietarioId).localeCompare(propName(b.proprietarioId))));
  const isNew=!s;s=s||{imovelId:ims[0]&&ims[0].id,data:defDate(S.mes),cat:'manut',desconta:true};
  const opts=(isNew?ims:S.imoveis).map(i=>[i.id,i.descricao+' · '+propName(i.proprietarioId)]);
  openDlg(isNew?'Lançar serviço':'Editar serviço',
    sel('Imóvel','imovelId',opts,s.imovelId,1)+
    inp('Descrição','descricao',s.descricao,'required placeholder="Troca da resistência do chuveiro"',1)+
    inp('Valor (R$)','valor',fmtIn(s.valor),'inputmode="decimal" required')+inp('Data','data',s.data,'type="date" required')+
    sel('Categoria no relatório','cat',Object.entries(CATS),s.cat,1)+
    `<label class="check"><input type="checkbox" name="desconta"${s.desconta!==false?' checked':''}> Descontar do repasse ao proprietário</label>`,
    {okLabel:isNew?'Lançar serviço':'Salvar',submit:async f=>{if(!f.descricao.trim())return 'Informe a descrição.';if(!parseBR(f.valor))return 'Informe o valor.';if(!f.data)return 'Informe a data.';
      const id=s.id||uid('s');
      await save('servicos',id,{imovelId:f.imovelId,descricao:f.descricao.trim(),valor:parseBR(f.valor),data:f.data,cat:f.cat,desconta:!!f.desconta});
      toast(f.data.startsWith(S.mes)?(isNew?'Serviço lançado':'Serviço atualizado'):'Lançado em '+mesLabel(f.data.slice(0,7)).toLowerCase())},
     del:s.id?async()=>{await remove('servicos',s.id);toast('Serviço excluído')}:null});
}
function dlgReceber(im){
  const id=im.id+'_'+S.mes,L=S.lanc[id]||{};
  openDlg('Aluguel de '+mesLabel(S.mes).toLowerCase(),
    `<p class="hint" style="margin:0">${esc(im.descricao)} · ${esc(propName(im.proprietarioId))}${im.inquilino?' · '+esc(im.inquilino):''}${im.vencimento?' · vence dia '+esc(im.vencimento):''}</p>`+
    inp('Valor recebido (R$)','valorRecebido',fmtIn(L.valorRecebido??im.valor),'inputmode="decimal" required')+
    inp('Data do pagamento','dataPagamento',L.dataPagamento||defDate(S.mes),'type="date" required')+
    inp('Outros recebimentos (R$)','outros',fmtIn(L.outros||0),'inputmode="decimal"',1)+
    `<p class="hint">Multa, IPTU repassado ou outro valor recebido junto com o aluguel.</p>`,
    {okLabel:'Marcar recebido',delLabel:'Desmarcar',submit:async f=>{if(!f.dataPagamento)return 'Informe a data do pagamento.';
      await save('lancamentos',id,{imovelId:im.id,mes:S.mes,recebido:true,valorRecebido:parseBR(f.valorRecebido),dataPagamento:f.dataPagamento,outros:parseBR(f.outros)});
      toast('Aluguel marcado como recebido')},
     del:L.recebido?async()=>{await remove('lancamentos',id);toast('Recebimento desmarcado')}:null});
}
function dlgRepasse(p){
  const id=p.id+'_'+S.mes,R=S.rep[id]||{},c=calcProp(p.id,S.mes);
  openDlg('Repasse de '+mesLabel(S.mes).toLowerCase(),
    `<div class="preview"><div><div class="k">Receita</div><div class="v">${brl(c.receita)}</div></div><div><div class="k">Descontos</div><div class="v">${brl(c.despesas+c.taxa)}</div></div><div><div class="k">Valor líquido</div><div class="v">${brl(c.liquido)}</div></div></div>`+
    `<p class="hint">${esc(p.nome)}${p.forma?' · '+esc(p.forma):''}</p>`+
    inp('Data do repasse','data',R.data||defDate(S.mes),'type="date" required')+
    inp('Valor repassado (R$)','valor',fmtIn(R.valor??c.liquido),'inputmode="decimal"')+
    `<label class="f full">Observações do mês<textarea name="obs" placeholder="Não houve reparos ao imóvel neste período.">${esc(R.obs||'')}</textarea></label><p class="hint">Uma observação por linha. Elas saem na seção 6 do PDF.</p>`,
    {okLabel:'Registrar repasse',delLabel:'Desmarcar',submit:async f=>{if(!f.data)return 'Informe a data do repasse.';
      await save('repasses',id,{proprietarioId:p.id,mes:S.mes,feito:true,data:f.data,valor:parseBR(f.valor),obs:f.obs.trim()});
      toast('Repasse registrado')},
     del:R.feito?async()=>{await remove('repasses',id);toast('Repasse desmarcado')}:null});
}
function dlgCfg(){
  const c=S.cfg;
  openDlg('Dados da empresa',
    inp('Empresa','empresa',c.empresa||'Golden Vision-Imobiliária e Serviços','',1)+inp('CRECI da empresa','creci',c.creci)+
    inp('Taxa de administração padrão (%)','taxaPadrao',String(c.taxaPadrao??10).replace('.',','),'inputmode="decimal"')+
    inp('Responsável','responsavel',c.responsavel)+inp('CRECI-PF','creciPF',c.creciPF)+
    `<p class="hint">A taxa padrão vale para novos imóveis. Cada imóvel pode ter a sua.</p>`,
    {submit:async f=>{await save('config','geral',{empresa:f.empresa.trim(),creci:f.creci.trim(),taxaPadrao:parseBR(f.taxaPadrao),responsavel:f.responsavel.trim(),creciPF:f.creciPF.trim()});toast('Dados salvos')}});
}

/* ================= PDF ================= */
function reportData(p,m){
  const ims=imoveisDe(p.id),c=calcProp(p.id,m),R=repOf(p.id,m),obs=[];
  if(R&&R.obs)R.obs.split('\n').map(s=>s.trim()).filter(Boolean).forEach(s=>obs.push(s));
  if(!obs.length&&!c.serv.length)obs.push(ims.length>1?'Não houve reparos aos imóveis neste período.':'Não houve reparos ao imóvel neste período.');
  return{periodo:m.slice(5)+'-'+m.slice(0,4),imoveisTxt:ims.map(i=>i.descricao).join('; ')||'—',proprietario:p.nome,
    receita:c.receita,despesas:c.despesas,taxa:c.taxa,liquido:c.liquido,alugueis:c.aluguel,outros:c.outros,desp:c.desp,
    itensDesp:c.serv.map(s=>dBR(s.data)+' · '+s.descricao+' ('+(CATS[s.cat]||'Outros')+'): '+brl(s.valor)+(ims.length>1?' · '+s.imovel.descricao:'')),
    repasses:R&&R.feito?[{data:dBR(R.data),valor:R.valor??c.liquido}]:[],forma:p.forma,
    situacao:ims.map(i=>({titulo:i.descricao,status:i.status||'Locado',inquilino:i.status==='Vago'?'':i.inquilino,pagamento:pagStatus(i,m).pdf})),
    obs,cfg:S.cfg};
}
async function gerarPDF(pid,m){
  const p=S.props.find(x=>x.id===pid);if(!p)return;
  if(!window.jspdf){toast('Gerador de PDF ainda carregando, tente de novo');return}
  const doc=buildReportPDF(window.jspdf.jsPDF,reportData(p,m),LOGO_PDF);
  const nome=p.nome.split(' ').filter(Boolean);const curto=(nome[0]||'')+(nome.length>1?'_'+nome[nome.length-1]:'');
  const filename=`Relatorio_Prestacao_de_contas-_${curto}_${m.slice(5)}-${m.slice(0,4)}.pdf`;
  if(await baixarArquivo(filename,doc.output('blob')))toast('PDF gerado');
}

/* ================= eventos ================= */
document.addEventListener('click',e=>{
  if(e.target.closest('dialog'))return;
  const v=e.target.closest('[data-view]');if(v){S.view=v.dataset.view;S.q='';closeDrawer();render();scrollTo(0,0);return}
  const t=e.target.closest('[data-act]');
  if(!t){const o=e.target.closest('[data-open]');if(o)openDrawer(o.dataset.open);return}
  const a=t.dataset.act,id=t.dataset.id,pid=t.dataset.pid;
  const P=()=>S.props.find(x=>x.id===(pid||id));
  e.stopPropagation();
  switch(a){
    case 'mPrev':S.mes=shiftMes(S.mes,-1);render();break;
    case 'mNext':S.mes=shiftMes(S.mes,1);render();break;
    case 'fechar':closeDrawer();break;
    case 'novoCliente':dlgCliente();break;
    case 'editCliente':dlgCliente(P());break;
    case 'novoImovel':dlgImovel(null,pid);break;
    case 'editImovel':if(!S.readonly)dlgImovel(S.imoveis.find(x=>x.id===id));break;
    case 'novoServico':dlgServico(null,pid);break;
    case 'editServico':if(!S.readonly)dlgServico(S.servicos.find(x=>x.id===id));break;
    case 'receber':dlgReceber(S.imoveis.find(x=>x.id===id));break;
    case 'repasse':dlgRepasse(P());break;
    case 'pdf':gerarPDF(pid,S.mes);break;
    case 'pdfMes':gerarPDF(pid,t.dataset.m);break;
    case 'editCfg':dlgCfg();break;
    case 'backup':backup();break;
    case 'restaurar':restaurar();break;
    case 'trocarSrv':trocarSrv=true;pinMsg='';render();break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.drawer&&!dlg.open)closeDrawer();
  if(e.key==='Enter'&&e.target.matches('tr[tabindex]'))e.target.click();
});
$('#scrim').onclick=closeDrawer;
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=$('#q');if(q){q.focus();q.setSelectionRange(pos,pos)}}});

render();
initDb();
})();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
